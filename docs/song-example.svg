<svg xmlns="http://www.w3.org/2000/svg" width="820" height="270" viewBox="0 0 820 270" role="img" aria-labelledby="title description">
  <title id="title">Song example terminal output</title>
  <desc id="description">A terminal showing two Frank Ocean songs and the Song class aggregate values.</desc>
  <rect width="820" height="270" rx="12" fill="#171923"/>
  <path d="M12 0h796a12 12 0 0 1 12 12v32H0V12A12 12 0 0 1 12 0Z" fill="#252938"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text x="410" y="27" text-anchor="middle" fill="#cbd0dc" font-family="sans-serif" font-size="13">Python Music Library System</text>
  <g fill="#e7eaf0" font-family="monospace" font-size="15">
    <text x="28" y="78"><tspan fill="#8bd49c">$</tspan> python -m examples.song_example</text>
